<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#f0fdfa"/>
  <!-- examples: photos, text and recordings -->
  <g stroke="#1f2937" stroke-width="6">
    <rect x="40" y="34" width="96" height="96" rx="14" fill="#bae6fd"/>
    <rect x="152" y="34" width="96" height="96" rx="14" fill="#ffffff"/>
    <rect x="264" y="34" width="96" height="96" rx="14" fill="#ffffff"/>
    <rect x="40" y="146" width="96" height="96" rx="14" fill="#ffffff"/>
    <rect x="152" y="146" width="96" height="96" rx="14" fill="#fed7aa"/>
    <rect x="264" y="146" width="96" height="96" rx="14" fill="#ffffff"/>
  </g>
  <!-- photo 1: sun and hill -->
  <circle cx="108" cy="64" r="13" fill="#facc15"/>
  <path d="M43 127 l36 -42 l30 30 l24 -18 v30z" fill="#16a34a"/>
  <!-- text -->
  <g fill="#94a3b8">
    <rect x="168" y="58" width="64" height="9" rx="4.5"/>
    <rect x="168" y="77" width="54" height="9" rx="4.5"/>
    <rect x="168" y="96" width="40" height="9" rx="4.5"/>
    <rect x="56" y="170" width="64" height="9" rx="4.5"/>
    <rect x="56" y="189" width="48" height="9" rx="4.5"/>
    <rect x="56" y="208" width="58" height="9" rx="4.5"/>
  </g>
  <!-- recordings -->
  <g stroke="#1cb0f6" stroke-width="8" stroke-linecap="round">
    <line x1="286" y1="74" x2="286" y2="90"/>
    <line x1="302" y1="62" x2="302" y2="102"/>
    <line x1="318" y1="54" x2="318" y2="110"/>
    <line x1="334" y1="66" x2="334" y2="98"/>
    <line x1="286" y1="186" x2="286" y2="202"/>
    <line x1="302" y1="174" x2="302" y2="214"/>
    <line x1="318" y1="180" x2="318" y2="208"/>
    <line x1="334" y1="170" x2="334" y2="218"/>
  </g>
  <!-- photo 2: tree -->
  <rect x="195" y="196" width="10" height="34" fill="#92400e"/>
  <circle cx="200" cy="186" r="24" fill="#16a34a"/>
  <!-- into the AI -->
  <path d="M182 262 l18 22 l18 -22" fill="none" stroke="#1f2937" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#9d5b25" stroke-width="9" stroke-linecap="round">
    <line x1="134" y1="316" x2="114" y2="316"/>
    <line x1="134" y1="344" x2="114" y2="344"/>
    <line x1="266" y1="316" x2="286" y2="316"/>
    <line x1="266" y1="344" x2="286" y2="344"/>
  </g>
  <rect x="130" y="298" width="140" height="64" rx="14" fill="#1f2937"/>
  <text x="200" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="40" fill="#facc15">AI</text>
</svg>
